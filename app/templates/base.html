<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ page_title }}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="/static/css/app.css"
        rel="stylesheet"
    >
</head>

<body>

<nav
    class="navbar navbar-expand-lg navbar-dark bg-dark"
>
    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            Scam Website Detector
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
        >
            <span
                class="navbar-toggler-icon"
            ></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >
            <ul
                class="navbar-nav ms-auto"
            >

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/"
                    >
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/history"
                    >
                        Scan History
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/docs"
                    >
                        API Docs
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer
    class="border-top mt-5 py-4"
>
    <div
        class="container text-center text-muted small"
    >
        Real-Time Scam Website Detection System
        using Heuristic and Behavioural Analysis
    </div>
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% block scripts %}
{% endblock %}

</body>
</html>
