{% extends "base.html" %}


{% block content %}

<div class="container py-5">

    <div
        class="row justify-content-center"
    >

        <div class="col-lg-6">

            <div
                class="card shadow-sm border-0"
            >

                <div
                    class="card-body text-center p-5"
                >

                    <h1 class="h3">
                        {{ error_title }}
                    </h1>

                    <p
                        class="text-muted mt-3"
                    >
                        {{ error_message }}
                    </p>

                    <a
                        href="/"
                        class="btn btn-primary mt-2"
                    >
                        Return Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
